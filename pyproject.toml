[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
markers = ["private: integration tests requiring local payroll documents"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["data", "venv", ".venv", ".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["src", "scripts", "tests", "app.py"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
show_column_numbers = true
pretty = false
follow_imports = "silent"
